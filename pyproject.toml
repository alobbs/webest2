[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webest2"
version = "0.1.0"
authors = [
    {name = "Alvaro Lopez Ortega", email = "alvaro@alobbs.com"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
homepage = "https://github.com/alobbs/webest2"

[tool.setuptools]
packages = ["webest2"]

[tool.setuptools.package-data]
mypackage = ["*.txt"]
